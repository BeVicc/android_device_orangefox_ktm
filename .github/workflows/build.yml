name: Build OrangeFox Recovery [ktm]

on:
  workflow_dispatch:
    inputs:
      BUILD_TYPE:
        description: 'Build type'
        required: true
        default: 'Stable'
        type: choice
        options:
          - Stable
          - Beta
      CREATE_RELEASE:
        description: 'Create a GitHub Release with the built artifacts'
        required: true
        default: true
        type: boolean
      RELEASE_TAG:
        description: 'Release tag (e.g. v3.0.0). Only used when Create Release is true.'
        required: false
        default: ''

# Only one build at a time to save runner minutes
concurrency:
  group: build-ktm
  cancel-in-progress: false

jobs:
  build:
    name: Build OrangeFox for OnePlus Ace 6
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    env:
      DEVICE: ktm
      PRODUCT_NAME: twrp_ktm

    steps:
      # ----------------------------------------------------------------
      # 1. Check out the device tree first so the workflow file is present
      # ----------------------------------------------------------------
      - name: Check Out Device Tree
        uses: actions/checkout@v4
        with:
          path: DT

      # ----------------------------------------------------------------
      # 2. Maximise available disk space (~80 GB)
      # ----------------------------------------------------------------
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      # ----------------------------------------------------------------
      # 3. Install build dependencies
      # ----------------------------------------------------------------
      - name: Install Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 libncurses5 pngcrush schedtool \
            libssl-dev bc rsync ccache gperf lz4 libelf-dev
          sudo apt-get clean

      # ----------------------------------------------------------------
      # 4. Set up Java 11 (required by Android build system)
      # ----------------------------------------------------------------
      - name: Set Up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      # ----------------------------------------------------------------
      # 5. Set up the repo tool and git identity
      # ----------------------------------------------------------------
      - name: Set Up Repo Tool
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name  "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui   false

      # ----------------------------------------------------------------
      # 6. Native R12 Script Substitution
      # ----------------------------------------------------------------
      - name: Clone & sync source
        run: |
          mkdir -p ~/OrangeFox_14
          cd ~/OrangeFox_14
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          # Modify the script to natively fetch the R12 codebase
          sed -i 's/git clone $URL -b $FOX_BRANCH "$dest";/git clone $URL -b fox_14.1-R12-new "$dest";/g' orangefox_sync.sh
          ./orangefox_sync.sh --branch 14.1 --path ~/fox_14.1
          
      # ----------------------------------------------------------------
      # 7. Clone device tree
      # ----------------------------------------------------------------
      - name: Clone device tree
        run: |
          cd ~/fox_14.1/device
          mkdir -p oneplus
          cd oneplus
          # We use the code we already checked out as it has the latest commits
          cp -r $GITHUB_WORKSPACE/DT ktm

      # ----------------------------------------------------------------
      # 8. BUILD
      # ----------------------------------------------------------------
      - name: BUILD
        id: build
        run: |
          set -o pipefail
          
          cd ~/fox_14.1
          
          # Inject workflow type via environment implicitly
          export FOX_BUILD_TYPE="${{ github.event.inputs.BUILD_TYPE || 'Stable' }}"
          
          source build/envsetup.sh
          lunch ${{ env.PRODUCT_NAME }}-eng
          
          mka recoveryimage -j$(nproc --all) 2>&1 | tee build.log

          # Surface the output paths
          OUT_DIR=~/fox_14.1/out/target/product/${{ env.DEVICE }}
          echo "OUT_DIR=$OUT_DIR" >> $GITHUB_ENV

          IMG=$(find "$OUT_DIR" -maxdepth 1 -name "OrangeFox*.img" | head -1)
          ZIP=$(find "$OUT_DIR" -maxdepth 1 -name "OrangeFox*.zip" | head -1)

          echo "RECOVERY_IMG=$IMG" >> $GITHUB_ENV
          echo "RECOVERY_ZIP=$ZIP" >> $GITHUB_ENV
          echo "IMG_NAME=$(basename $IMG)" >> $GITHUB_ENV
          echo "ZIP_NAME=$(basename $ZIP)" >> $GITHUB_ENV

          echo ""
          echo "=== Build Output ==="
          ls -lh "$OUT_DIR"/OrangeFox* || echo "(no OrangeFox files found)"

      # ----------------------------------------------------------------
      # 9. Upload build log on failure for debugging
      # ----------------------------------------------------------------
      - name: Upload Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.DEVICE }}-${{ github.run_number }}
          path: ~/fox_14.1/build.log
          retention-days: 7

      # ----------------------------------------------------------------
      # 10. Upload artifacts
      # ----------------------------------------------------------------
      - name: Upload Recovery Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-R12_${{ env.DEVICE }}_build-${{ github.run_number }}
          path: |
            ${{ env.RECOVERY_IMG }}
            ${{ env.RECOVERY_ZIP }}
          if-no-files-found: error
          retention-days: 30

      # ----------------------------------------------------------------
      # 11. Create a tagged GitHub Release (optional – on manual trigger)
      # ----------------------------------------------------------------
      - name: Create GitHub Release
        if: >
          success() &&
          github.event.inputs.CREATE_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: >-
            ${{ github.event.inputs.RELEASE_TAG != '' &&
                github.event.inputs.RELEASE_TAG ||
                format('build-{0}', github.run_number) }}
          name: OrangeFox R12 [${{ env.DEVICE }}] – Build ${{ github.run_number }}
          body: |
            ## OrangeFox Recovery R12 for OnePlus Ace 6 (`ktm`)

            **Build type:** ${{ github.event.inputs.BUILD_TYPE || 'Stable' }}
            **Vendor branch:** `fox_14.1`
            **Built from:** ${{ github.sha }}
            **Date:** ${{ github.run_started_at }}

            ### Artifacts
            | File | Description |
            |------|-------------|
            | `${{ env.IMG_NAME }}` | Flash via `fastboot flash recovery *.img` |
            | `${{ env.ZIP_NAME }}` | Flash from within OrangeFox |

            ### Installation
            See the [XDA Thread](https://xdaforums.com/t/recovery-unofficial-orangefox-recovery-r11-3_2-for-oneplus-ace-6-ktm.4774231) for full instructions.
          files: |
            ${{ env.RECOVERY_IMG }}
            ${{ env.RECOVERY_ZIP }}
          draft: false
          prerelease: ${{ github.event.inputs.BUILD_TYPE == 'Beta' }}
